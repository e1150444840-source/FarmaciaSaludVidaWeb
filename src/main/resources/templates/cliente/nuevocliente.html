<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Nuevo Cliente</title>
</head>

<body>

	<!-- multi-column ordering -->
	<div layout:fragment="contenidopaguinas">
		<h4 class="card-title">NUEVO CLIENTES</h4>
		<form th:action="@{/cliente/guardar}" th:object="${cliente}" method="post">
			<div class="mb-3">
				<input type="hidden" class="form-label" id="idCiente" th:field="*{idCliente}" />
			</div>
			<div class="mb-3">
				<label for="nombre" class="form-label">NOMBRE</label> 
				<input type="text" class="form-control" id="nombre" th:field="*{nombreCliente}">
			</div>
			<div class="mb-3">
				<label for="apellido" class="form-label">APELLIDO</label> 
				<input	type="text" class="form-control" id="apellido" th:field="*{apellidoCliente}">
			</div>
			<div class="mb-3">
				<label for="cedula" class="form-label">CÉDULA</label> 
				<input type="text" class="form-control" id="cedula" th:field="*{ciCliente}">
			</div>
			<div class="mb-3">
				<label for="telefono" class="form-label">TELÉFONO</label> 
				<input type="text" class="form-control" id="telefono" th:field="*{telefonoCliente}">
			</div>
			<div class="mb-3">
				<label for="direccion" class="form-label">DIRECCIÓN</label> 
				<input type="text" class="form-control" id="direccion" th:field="*{direccionCliente}">
			</div>
			<div class="mb-3">
				<label for="email" class="form-label">CORREO ELECTRÓNICO</label> 
				<input type="email" class="form-control" id="email" 
				aria-describedby="email" th:field="*{correoCliente}">
			</div>
			<button type="submit" class="btn btn-primary">GUARDAR</button>
		</form>

	</div>
</body>

</html>
