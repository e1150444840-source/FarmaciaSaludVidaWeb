<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Lista Cliente</title>
</head>

<body>

	<!-- multi-column ordering -->
	<div layout:fragment="contenidopaguinas">
		<!-- Cabecera con Título y Botón Nuevo Cliente -->
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="card-title mb-0 fw-bold">LISTA DE CLIENTES</h4>
			<a th:href="@{/cliente/nuevoCliente}" class="btn btn-success"> <i
				class="fas fa-plus me-1"></i> Nuevo Cliente
			</a>
		</div>
		<div class="table-responsive">
			<table id="multi_col_order"
				class="table border table-striped table-bordered text-nowrap"
				style="width: 100%">
				<thead>
					<tr>
						<th>ID</th>
						<th>NOMBRE</th>
						<th>APELLIDO</th>
						<th>TIPO CLIENTE</th>
						<th>CÉDULA</th>
						<th>TELÉFONO</th>
						<th>DIRECCIÓN</th>
						<th>CORREO ELECTRÓNICO</th>
						<th>ACCIONES</th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="indice : ${listaClientes}">
						<td th:text="${indice.idCliente}"></td>
						<td th:text="${indice.nombreCliente}"></td>
						<td th:text="${indice.apellidoCliente}"></td>
						<td th:text="${indice.fkTipoCliente.nombreTipoCliente}"></td>
						<td th:text="${indice.ciCliente}"></td>
						<td th:text="${indice.telefonoCliente}"></td>
						<td th:text="${indice.direccionCliente}"></td>
						<td th:text="${indice.correoCliente}"></td>
						<td>
							<a th:href="@{/cliente/editar/{idCliente}(idCliente=${indice.idCliente})}"
							class="btn btn-primary" title="Editar"> <i	class="far fa-edit"></i></a> 
							<a th:href="@{/cliente/eliminar/{idCliente}(idCliente=${indice.idCliente})}" 
							class="btn btn-danger" title="Eliminar" 
							onclick="return confirm('¿Seguro que deseas eliminar este cliente?');">
							<i class="far fa-trash-alt"></i></a>
						</td>
					</tr>


				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
