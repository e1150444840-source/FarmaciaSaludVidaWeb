<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Lista Tipo Cliente</title>
</head>

<body>

	<!-- multi-column ordering -->
	<div layout:fragment="contenidopaguinas">
		<h4 class="card-title">LISTA TIPO CLIENTES</h4>
		<div class="table-responsive">
			<table id="multi_col_order"
				class="table border table-striped table-bordered text-nowrap"
				style="width: 100%">
				<thead>
					<tr>
						<th>ID</th>
						<th>NOMBRE TIPO CLIENTE</th>
						<th>DESCRIPCIÓN</th>
						<th>ESTADO</th>
						<th>ACCIONES</th>

					</tr>
				</thead>

				<tbody>
					<tr th:each="indice : ${listaTipoCliente}">
						<td th:text="${indice.idTipoCliente}"></td>
						<td th:text="${indice.nombreTipoCliente}"></td>
						<td th:text="${indice.descripcion}"></td>
						<td th:text="${indice.estado}"></td>
						<td><a th:href="@{/tipoCliente/editar/{idTipoCliente}
								(idTipoCliente=${indice.idTipoCliente})}"								
							class="btn btn-primary" title="Editar"> <i
								class="far fa-edit"></i></a> <a href="" class="btn btn-danger"
							title="Eliminar"> <i class="far fa-trash-alt"></i></a></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
