<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Lista Lote</title>
</head>

<body>

	<!-- multi-column ordering -->
	<div layout:fragment="contenidopaguinas">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="card-title mb-0 fw-bold">LISTA DE LOTE</h4>
			<a th:href="@{/lote/nuevoLote}" class="btn btn-success"> <i
				class="fas fa-plus me-1"></i> Nuevo Lote
			</a>
		</div>
		<div class="table-responsive">
			<table id="multi_col_order"
				class="table border table-striped table-bordered text-nowrap"
				style="width: 100%">
				<thead>
					<tr>
						<th>ID</th>
						<th>NÚMERO DE LOTE</th>					
						<th>NOMBRE PRODUCTO</th>
						<th>FECHA DE INGRESO</th>
						<th>FECHA DE CADUCIDAD</th>	
						<th>ACCIONES</th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="indice : ${listaLote}">
						<td th:text="${indice.idLote}"></td>
						<td th:text="${indice.numeroLote}"></td>
						<td th:text="${indice.fkProducto.nombreProducto}"></td>
						<td th:text="${indice.fechaIngreso}"></td>
						<td th:text="${indice.fechaCaducidad}"></td>
						<td><a
							th:href="@{/lote/editar/{idLote}(idLote=${indice.idLote})}"
							class="btn btn-primary" title="Editar"> <i
								class="far fa-edit"></i></a> <a href="" class="btn btn-danger"
							title="Eliminar"> <i class="far fa-trash-alt"></i></a></td>
					</tr>


				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
