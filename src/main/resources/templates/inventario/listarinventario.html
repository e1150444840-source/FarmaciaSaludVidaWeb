<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Lista Inventario</title>
</head>

<body>

	<!-- multi-column ordering -->
	<div layout:fragment="contenidopaguinas">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="card-title mb-0 fw-bold">LISTA DE INVENTARIO</h4>
			<a th:href="@{/inventario/nuevoInventario}" class="btn btn-success"> <i
				class="fas fa-plus me-1"></i> Nuevo Inventario
			</a>
		</div>
		<div class="table-responsive">
			<table id="multi_col_order"
				class="table border table-striped table-bordered text-nowrap"
				style="width: 100%">
				<thead>
					<tr>
						<th>ID</th>
						<th>STOCK ACTUAL</th>					
						<th>FARMACIA</th>
						<th>LOTE</th>
						<th>ACCIONES</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="indice : ${listaInventario}">
						<td th:text="${indice.idInventario}"></td>
						<td th:text="${indice.stockActual}"></td>
						<td th:text="${indice.fkFarmacia.nombreFarmacia}"></td>						
						<td th:text="${indice.fkLote.numeroLote}"></td>
						<td>
							<a th:href="@{/inventario/editar/{idInventario}(idInventario=${indice.idInventario})}"
							class="btn btn-primary" title="Editar"> <i  class="far fa-edit"></i></a> 
							<a th:href="@{/inventario/eliminar/{idInventario}(idInventario=${indice.idInventario})}" 
							class="btn btn-danger" title="Eliminar" 
							onclick="return confirm('¿Seguro que deseas eliminar este Inventario');">
							<i class="far fa-trash-alt"></i></a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
