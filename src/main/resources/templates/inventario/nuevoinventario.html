<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Nuevo Inventario</title>
</head>

<body>
	<!-- Formulario Registro Nuevo Inventario -->
	<div layout:fragment="contenidopaguinas">
		<div class="row justify-content-center">
			<div class="col-lg-8">
				<!-- Tarjeta principal -->
				<div class="card shadow-sm border-0 rounded-3 my-3">

					<!-- Cabecera de la tarjeta -->
					<div class="card-header bg-primary text-white py-3 rounded-top">
						<h5 class="card-title mb-0 fw-bold">
							<i class="fas fa-warehouse me-2"></i> NUEVO INVENTARIO
						</h5>
					</div>

					<!-- Cuerpo del formulario -->
					<div class="card-body p-4">
						<form th:action="@{/inventario/guardar}" th:object="${inventario}"
							method="post">
							<div class="mb-3">
								<input type="hidden" th:field="*{idInventario}" value="0" />
							</div>
							<div class="row g-3">
								<!-- Stock Actual -->
								<div class="col-md-12">
									<label class="form-label fw-bold text-secondary">Stock
										Actual <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-cubes text-muted"></i></span> <input type="number"
											class="form-control" th:field="*{stockActual}"
											placeholder="0" min="0"  pattern="[0-9]{10}" 
											oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
									</div>
								</div>
							</div>

							<!-- Farmacia -->
							<div class="col-md-12">
								<label class="form-label fw-bold text-secondary">Farmacia
									<span class="text-danger">*</span>
								</label>
								<div class="input-group">
									<span class="input-group-text bg-light"><i
										class="fas fa-user-tag text-muted"></i></span> <select
										class="form-select" th:field="*{fkFarmacia.idFarmacia}"
										required>
										<option value="0" disabled selected>-- Seleccione una
											Farmacia --</option>
										<option th:each="farmacia: ${listaFarmacia}"
											th:value="${farmacia.idFarmacia}"
											th:text="${farmacia.nombreFarmacia}"></option>
									</select>
								</div>
							</div>

							<!-- Lote -->
							<div class="col-md-12">
								<label class="form-label fw-bold text-secondary">Lote
									<span class="text-danger">*</span>
								</label>
								<div class="input-group">
									<span class="input-group-text bg-light"><i
										class="fas fa-user-tag text-muted"></i></span> <select
										class="form-select" th:field="*{fkLote.idLote}" required>
										<option value="0" disabled selected>-- Seleccione un
											Lote --</option>
										<option th:each="lote: ${listaLote}" 
											th:value="${lote.idLote}"
											th:text="${lote.numeroLote}"></option>
									</select>
								</div>
							</div>

							<!-- Botones de Acción -->
							<div
								class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
								<a th:href="@{/inventario}"
									class="btn btn-outline-secondary px-4"> <i
									class="fas fa-times me-1"></i> Cancelar
								</a>
								<button type="submit" class="btn btn-primary px-4">
									<i class="fas fa-save me-1"></i> Guardar
								</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
