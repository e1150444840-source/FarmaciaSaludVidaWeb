<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Lista Vehículo</title>
</head>

<body>

	<!-- multi-column ordering -->
	<div layout:fragment="contenidopaguinas">
		<h4 class="card-title">LISTA DE VEHÍCULO</h4>
		<div class="table-responsive">
			<table id="multi_col_order"
				class="table border table-striped table-bordered text-nowrap"
				style="width: 100%">
				<thead>
					<tr>
						<th>ID</th>
						<th>PLACA</th>
						<th>CAPACIDAD</th>
						<th>ESTADO DISPONIVILIDAD</th>
						<th>ACCIONES</th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="indice : ${listaVehiculo}">
						<td th:text="${indice.idVehiculo}"></td>
						<td th:text="${indice.placa}"></td>
						<td th:text="${indice.capacidad}"></td>
						<td th:text="${indice.estadoDisponibilidad}"></td>
						<td>
							<a th:href="@{/vehiculo/editar/{idVehiculo}(idVehiculo=${indice.idVehiculo})}"
							 class="btn btn-primary" title="Editar">
							<i class="far fa-edit"></i></a> 
							<a href="" class="btn btn-danger" title="Eliminar">
							<i class="far fa-trash-alt"></i></a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
