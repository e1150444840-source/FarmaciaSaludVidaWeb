<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Nuevo Vehículo</title>
</head>

<body>
	<!-- Formulario Registro Nuevo Vehículo -->
	<div layout:fragment="contenidopaguinas">
		<div class="row justify-content-center">
			<div class="col-lg-8">
				<!-- Tarjeta principal -->
				<div class="card shadow-sm border-0 rounded-3 my-3">

					<!-- Cabecera de la tarjeta -->
					<div class="card-header bg-primary text-white py-3 rounded-top">
						<h5 class="card-title mb-0 fw-bold">
							<i class="fas fa-truck me-2"></i> NUEVO VEHÍCULO
						</h5>
					</div>

					<!-- Cuerpo del formulario -->
					<div class="card-body p-4">
						<form th:action="@{/vehiculo/guardar}" th:object="${vehiculo}"
							method="post">
							<div class="mb-3">
								<input type="hidden" th:field="*{idVehiculo}" value="0" />
							</div>
							<div class="row g-3">
								<!-- Placa -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Placa
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-car text-muted"></i></span> <input type="text"
											class="form-control" th:field="*{placa}"
											placeholder="Ej. LBA-1234" required>
									</div>
								</div>

								<!-- Capacidad -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Capacidad
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-weight-hanging text-muted"></i></span> <input
											type="text" class="form-control"
											th:field="*{capacidad}"
											placeholder="Ej. 1.5 Toneladas / 50 Cajas" required>
									</div>
								</div>

								<!-- Disponibilidad -->
								<div class="col-md-12">
									<label class="form-label fw-bold text-secondary">Disponibilidad
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-info-circle text-muted"></i></span> <select
											class="form-select" th:field="*{estadoDisponibilidad}"
											required>
											<option value="0" disabled selected>-- Seleccione un estado --</option>
											<option value="DISPONIBLE">DISPONIBLE</option>
											<option value="EN_RUTA">EN RUTA</option>
											<option value="MANTENIMIENTO">MANTENIMIENTO</option>
											<option value="NO_DISPONIBLE">NO DISPONIBLE</option>
										</select>
									</div>
								</div>
							</div>

							<!-- Botones de Acción -->
							<div
								class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
								<a th:href="@{/vehiculo}"
									class="btn btn-outline-secondary px-4"> <i
									class="fas fa-times me-1"></i> Cancelar
								</a>
								<button type="submit" class="btn btn-primary px-4">
									<i class="fas fa-save me-1"></i> Guardar
								</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
