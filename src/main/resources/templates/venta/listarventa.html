<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Lista Ventas</title>
</head>

<body>

	<!-- multi-column ordering -->
	<div layout:fragment="contenidopaguinas">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="card-title mb-0 fw-bold">LISTA DE VENTAS</h4>
			<a th:href="@{/venta/nuevoVenta}" class="btn btn-success"> <i
				class="fas fa-plus me-1"></i> Nueva Venta
			</a>
		</div>
		<div class="table-responsive">
			<table id="multi_col_order"
				class="table border table-striped table-bordered text-nowrap"
				style="width: 100%">
				<thead>
					<tr>
						<th>ID</th>
						<th>CLIENTE</th>
						<th>USUARIO</th>
						<th>CANAL DE VENTA</th>
						<th>FECHA DE VENTA</th>
						<th>SUBTOTAL</th>
						<th>IVA</th>
						<th>TOTAL</th>
						<th>ACCIONES</th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="indice : ${listaVenta}">
						<td th:text="${indice.idVenta}"></td>
						<td th:text="${indice.fkCliente.nombreCliente + ' ' + indice.fkCliente.apellidoCliente}"></td>
						<td th:text="${indice.fkUsuario.username}"></td>
						<td th:text="${indice.canalVenta}"></td>
						<td th:text="${indice.fechaEmison}"></td>
						<td th:text="${#numbers.formatDecimal(indice.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
						<td th:text="${#numbers.formatDecimal(indice.iva, 1, 'POINT', 2, 'COMMA')}"></td>
						<td th:text="${#numbers.formatDecimal(indice.total, 1, 'POINT', 2, 'COMMA')}"></td>
						<td>
							<a th:href="@{/venta/editar/{idVenta}(idVenta=${indice.idVenta})}"
								class="btn btn-primary btn-sm" title="Editar"> 
								<i class="far fa-edit"></i>
							</a> 
							<a th:href="@{/venta/eliminar/{idVenta}(idVenta=${indice.idVenta})}"
								class="btn btn-danger btn-sm" title="Eliminar"
								onclick="return confirm('¿Seguro que deseas eliminar esta Venta?');">
								<i class="far fa-trash-alt"></i>
							</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
