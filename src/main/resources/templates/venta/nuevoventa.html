<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Nuevo Venta</title>
</head>

<body>
	<!-- Formulario Registro Nueva Venta -->
	<div layout:fragment="contenidopaguinas">
		<div class="row justify-content-center">
			<div class="col-lg-10">
				<!-- Tarjeta principal -->
				<div class="card shadow-sm border-0 rounded-3 my-3">

					<!-- Cabecera de la tarjeta -->
					<div class="card-header bg-primary text-white py-3 rounded-top">
						<h5 class="card-title mb-0 fw-bold">
							<i class="fas fa-cash-register me-2"></i> NUEVA VENTA
						</h5>
					</div>

					<!-- Cuerpo del formulario -->
					<div class="card-body p-4">
						<form th:action="@{/venta/guardar}" th:object="${venta}"
							method="post">
							<div class="mb-3">
								<input type="hidden" th:field="*{idVenta}" value="0" />
							</div>
							<div class="row g-3">
								<!-- Canal de Venta -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Canal
										de Venta <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-store text-muted"></i></span> <select
											class="form-select" th:field="*{canalVenta}" required>
											<option value="" disabled selected>-- Seleccione una
												Opción --</option>
											<option value="FISICA">FÍSICA</option>
											<option value="EN_LINEA">EN LÍNEA</option>
										</select>
									</div>
								</div>

								<!-- Fecha de Venta -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Fecha
										Venta <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-calendar-alt text-muted"></i></span> <input
											class="form-control" th:field="*{fechaEmison}"
											required>
									</div>
								</div>
								<!-- Subtotal -->
								<div class="col-md-4">
									<label class="form-label fw-bold text-secondary">Subtotal
										($) <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-dollar-sign text-muted"></i></span> <input
											type="number" step="0.01" class="form-control"
											th:field="*{subtotal}" placeholder="0.00" required>
									</div>
								</div>

								<!-- IVA -->
								<div class="col-md-4">
									<label class="form-label fw-bold text-secondary">IVA
										($) <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-percentage text-muted"></i></span> <input
											type="number" step="0.01" class="form-control"
											th:field="*{iva}" placeholder="0.00" required>
									</div>
								</div>

								<!-- Total -->
								<div class="col-md-4">
									<label class="form-label fw-bold text-secondary">Total
										($) <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-calculator text-muted"></i></span> <input
											type="number" step="0.01" class="form-control"
											th:field="*{total}" placeholder="0.00" required>
									</div>
								</div>
								
								<!-- Cliente -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Nombre Cliente
									<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-tasks text-muted"></i></span> <select
											class="form-select" th:field="*{fkCliente.idCliente}" required>
											<option value="0" disabled selected>-- Seleccione un Cliente --</option>
											<option th:each="cliente: ${listaCliente}" 
													th:value="${cliente.idCliente}"
													th:text="${cliente.nombreCliente}"></option>
										</select>
									</div>
								</div>

								<!-- Usuario -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Nombre Usuario
									<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-tasks text-muted"></i></span> <select
											class="form-select" th:field="*{fkUsuario.idUsuario}"	required>
											<option value="0" disabled selected>-- Seleccione un Usuario --</option>
											<option th:each="usuario: ${listaUsuario}"
												th:value="${usuario.idUsuario}"
												th:text="${usuario.username}"></option>
										</select>
									</div>
								</div>
							</div>

							<!-- Botones de Acción -->
							<div
								class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
								<a th:href="@{/venta}" class="btn btn-outline-secondary px-4">
									<i class="fas fa-times me-1"></i> Cancelar
								</a>
								<button type="submit" class="btn btn-primary px-4">
									<i class="fas fa-save me-1"></i> Guardar
								</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
