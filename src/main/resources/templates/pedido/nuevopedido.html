<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Nuevo Pedido</title>
</head>

<body>
	<!-- Formulario Registro Nuevo Pedido -->
	<div layout:fragment="contenidopaguinas">
		<div class="row justify-content-center">
			<div class="col-lg-8">
				<!-- Tarjeta principal -->
				<div class="card shadow-sm border-0 rounded-3 my-3">

					<!-- Cabecera de la tarjeta -->
					<div class="card-header bg-primary text-white py-3 rounded-top">
						<h5 class="card-title mb-0 fw-bold">
							<i class="fas fa-shopping-cart me-2"></i> NUEVO PEDIDO
						</h5>
					</div>

					<!-- Cuerpo del formulario -->
					<div class="card-body p-4">
						<form th:action="@{/pedido/guardar}" th:object="${pedido}"
							method="post">
							<div class="mb-3">
								<input type="hidden" th:field="*{idPedido}" value="0" />
							</div>
							<div class="row g-3">
								<!-- Dirección de Pedido -->
								<div class="col-md-12">
									<label class="form-label fw-bold text-secondary">Dirección
										de Pedido <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-map-marker-alt text-muted"></i></span> <input
											type="text" class="form-control"
											th:field="*{direccionPedido}"
											placeholder="Ej. Av. 10 de Agosto y Bolívar" required>
									</div>
								</div>

								<!-- Fecha Pedido -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Fecha
										Venta <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-calendar-alt text-muted"></i></span> <input
											type="date" class="form-control" th:field="*{fechaPedido}"
											required>
									</div>
								</div>

								<!-- Estado del Pedido -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Estado
										del Pedido <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-tasks text-muted"></i></span> <select
											class="form-select" th:field="*{estadoPedido}" required>
											<option value="" disabled selected>-- Seleccione un Estado --</option>
											<option value="PENDIENTE">PENDIENTE</option>
											<option value="EN_PROCESO">EN PROCESO</option>
											<option value="COMPLETADO">COMPLETADO</option>
											<option value="CANCELADO">CANCELADO</option>
										</select>
									</div>
								</div>
								
								<!-- Venta -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Canal
										de Venta <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-tasks text-muted"></i></span> <select
											class="form-select" th:field="*{fkVenta.idVenta}" required>
											<option value="0" disabled selected>-- Seleccione una Venta --</option>
											<option th:each="venta: ${listaVenta}" th:value="${venta.idVenta}"
													th:text="${venta.canalVenta}"></option>
										</select>
									</div>
								</div>

								<!-- Vehiculo -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Placa
										Vehículo <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-tasks text-muted"></i></span> <select
											class="form-select" th:field="*{fkVehiculo.idVehiculo}"	required>
											<option value="0" disabled selected>-- Seleccione una Placa --</option>
											<option th:each="vehiculo: ${listaVehiculo}"
												th:value="${vehiculo.idVehiculo}"
												th:text="${vehiculo.placa}"></option>
										</select>
									</div>
								</div>
							</div>

							<!-- Botones de Acción -->
							<div
								class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
								<a th:href="@{/pedido}" class="btn btn-outline-secondary px-4">
									<i class="fas fa-times me-1"></i> Cancelar
								</a>
								<button type="submit" class="btn btn-primary px-4">
									<i class="fas fa-save me-1"></i> Guardar
								</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
