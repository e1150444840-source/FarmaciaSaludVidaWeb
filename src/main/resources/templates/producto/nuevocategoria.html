<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Nueva Categoria</title>
</head>

<body>
	<!-- Formulario Registro Nueva Categoría -->
	<div layout:fragment="contenidopaguinas">
		<div class="row justify-content-center">
			<div class="col-lg-8">
				<!-- Tarjeta principal -->
				<div class="card shadow-sm border-0 rounded-3 my-3">

					<!-- Cabecera de la tarjeta -->
					<div class="card-header bg-primary text-white py-3 rounded-top">
						<h5 class="card-title mb-0 fw-bold">
							<i class="fas fa-folder-plus me-2"></i> NUEVA CATEGORÍA
						</h5>
					</div>

					<!-- Cuerpo del formulario -->
					<div class="card-body p-4">
						<form th:action="@{/categoria/guardar}" th:object="${categoria}"
							method="post">
							<div class="mb-3">
								<input type="hidden" class="form-label" id="idCategoria"
									th:field="*{idCategoria}" />
							</div>
							<div class="row g-3">
								<!-- Nombre Categoría -->
								<div class="col-md-12">
									<label class="form-label fw-bold text-secondary">Nombre
										Categoria <span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-tag text-muted"></i></span> <input type="text"
											class="form-control" th:field="*{nombreCategoria}"
											placeholder="Ej. Analgésicos, Antibióticos, Cuidado Personal"
											required>
									</div>
								</div>
							</div>

							<!-- Botones de Acción -->
							<div
								class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
								<a th:href="@{/categoria}"
									class="btn btn-outline-secondary px-4"> <i
									class="fas fa-times me-1"></i> Cancelar
								</a>
								<button type="submit" class="btn btn-primary px-4">
									<i class="fas fa-save me-1"></i> Guardar
								</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
