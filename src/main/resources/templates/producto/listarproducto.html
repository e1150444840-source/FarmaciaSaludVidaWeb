<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Lista Producto</title>
</head>

<body>

	<!-- multi-column ordering -->
	<div layout:fragment="contenidopaguinas">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="card-title mb-0 fw-bold">LISTA DE PRODUCTO</h4>
			<a th:href="@{/producto/nuevoProducto}" class="btn btn-success">
				<i class="fas fa-plus me-1"></i> Nuevo Producto
			</a>
		</div>
		<div class="table-responsive">
			<table id="multi_col_order"
				class="table border table-striped table-bordered text-nowrap"
				style="width: 100%">
				<thead>
					<tr>
						<th>ID</th>
						<th>NOMBRE PRODUCTO</th>
						<th>CATEGORÍA</th>
						<th>LABORATORIO</th>
						<th>DESCRIPCIÓN</th>
						<th>ACCIONES</th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="indice : ${listaProducto}">
						<td th:text="${indice.idProducto}"></td>
						<td th:text="${indice.nombreProducto}"></td>
						<td th:text="${indice.fkCategoria.nombreCategoria}"></td>
						<td th:text="${indice.fkLaboratorio.nombreLaboratorio}"></td>			
						<td th:text="${indice.descripcion}"></td>
						<td><a
							th:href="@{/producto/editar/{idProducto}(idProducto=${indice.idProducto})}"
							class="btn btn-primary" title="Editar"> <i
								class="far fa-edit"></i></a> <a href="" class="btn btn-danger"
							title="Eliminar"> <i class="far fa-trash-alt"></i></a></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
