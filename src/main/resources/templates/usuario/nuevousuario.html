<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Nuevo Usuario</title>
</head>

<body>
	<!-- Formulario Registro Nuevo Usuario -->
	<div layout:fragment="contenidopaguinas">
		<div class="row justify-content-center">
			<div class="col-lg-10">
				<!-- Tarjeta principal -->
				<div class="card shadow-sm border-0 rounded-3 my-3">

					<!-- Cabecera de la tarjeta -->
					<div class="card-header bg-primary text-white py-3 rounded-top">
						<h5 class="card-title mb-0 fw-bold">
							<i class="fas fa-user-shield me-2"></i> NUEVO USUARIO
						</h5>
					</div>

					<!-- Cuerpo del formulario -->
					<div class="card-body p-4">
						<form th:action="@{/usuario/guardar}" th:object="${usuario}"
							method="post">
							<div class="mb-3">
								<input type="hidden" th:field="*{idUsuario}" value="0" />
							</div>
							<div class="row g-3">
								<!-- Nombre -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Nombre
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-user text-muted"></i></span> <input type="text"
											class="form-control" th:field="*{nombreUsuario}"
											placeholder="Ej. Carlos" required>
									</div>
								</div>

								<!-- Apellido -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Apellido
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-user text-muted"></i></span> <input type="text"
											class="form-control" th:field="*{apellidoUsuario}"
											placeholder="Ej. Masaco" required>
									</div>
								</div>

								<!-- Usuario / Username -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Usuario
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-at text-muted"></i></span> <input type="text"
											class="form-control" th:field="*{username}"
											placeholder="Ej. cmasaco" required>
									</div>
								</div>

								<!-- Contraseña -->
								<div class="col-md-6">
									<label class="form-label fw-bold text-secondary">Contraseña
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-lock text-muted"></i></span> <input type="password"
											class="form-control" th:field="*{password}"
											placeholder="password" required>
									</div>
								</div>

								<!-- Rol -->
								<div class="col-md-12">
									<label class="form-label fw-bold text-secondary">Rol <span
										class="text-danger">*</span></label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-tasks text-muted"></i></span> <select
											class="form-select" th:field="*{rol}" required>
											<option value="0" disabled selected>-- Seleccione un Rol--</option>
											<option value="USER">USER</option>
											<option value="ADMIN">ADMIN</option>
										</select>
									</div>
								</div>
								
								<!-- Checkbox Activo -->
								<div class="col-md-12 mt-3">
									<div class="form-check form-switch">
										<input class="form-check-input" type="checkbox" role="switch"
											id="estadoUsuarioActivo" th:field="*{estado}" checked>
										<label class="form-check-label fw-bold text-secondary"
											for="estadoUsuarioActivo">Activo</label>
									</div>
								</div>
							</div>

							<!-- Botones de Acción -->
							<div
								class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
								<a th:href="@{/usuario}" class="btn btn-outline-secondary px-4">
									<i class="fas fa-times me-1"></i> Cancelar
								</a>
								<button type="submit" class="btn btn-primary px-4">
									<i class="fas fa-save me-1"></i> Guardar
								</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
