<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Nueva Laboratorio</title>
</head>

<body>
	<!-- Formulario Registro Nuevo Laboratorio -->
	<div layout:fragment="contenidopaguinas">
		<div class="row justify-content-center">
			<div class="col-lg-8">
				<!-- Tarjeta principal -->
				<div class="card shadow-sm border-0 rounded-3 my-3">

					<!-- Cabecera de la tarjeta -->
					<div class="card-header bg-primary text-white py-3 rounded-top">
						<h5 class="card-title mb-0 fw-bold">
							<i class="fas fa-flask me-2"></i> NUEVO LABORATORIO
						</h5>
					</div>

					<!-- Cuerpo del formulario -->
					<div class="card-body p-4">
						<form th:action="@{/laboratorio/guardar}"
							th:object="${laboratorio}" method="post">
							<div class="mb-3">
								<input type="hidden" th:field="*{idLaboratorio}" value="0" />
							</div>
							<div class="row g-3">
								<!-- Nombre del Laboratorio -->
								<div class="col-md-12">
									<label class="form-label fw-bold text-secondary">Nombre
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-building text-muted"></i></span> <input type="text"
											class="form-control" th:field="*{nombreLaboratorio}"
											placeholder="Ej. Bayer, Pfizer, Laboratorios LIFE" required>
									</div>
								</div>

								<!-- Teléfono del Laboratorio -->
								<div class="col-md-12">
									<label class="form-label fw-bold text-secondary">Teléfono
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-phone text-muted"></i></span> <input type="text"
											class="form-control" th:field="*{telefonoLaboratorio}"
											placeholder="Ej. 022123456" maxlength="10" pattern="[0-9]{10}" 
											oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
									</div>
								</div>
							</div>

							<!-- Botones de Acción -->
							<div
								class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
								<a th:href="@{/laboratorio}"
									class="btn btn-outline-secondary px-4"> <i
									class="fas fa-times me-1"></i> Cancelar
								</a>
								<button type="submit" class="btn btn-primary px-4">
									<i class="fas fa-save me-1"></i> Guardar
								</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
