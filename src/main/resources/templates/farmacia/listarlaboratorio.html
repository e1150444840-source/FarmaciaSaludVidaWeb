<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Lista Laboratorio</title>
</head>

<body>

	<!-- multi-column ordering -->
	<div layout:fragment="contenidopaguinas">
		<!-- Cabecera con Título y Botón Nuevo Cliente -->
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="card-title mb-0 fw-bold">LISTA DE LABORATORIO</h4>
			<a th:href="@{/laboratorio/nuevoLaboratorio}" class="btn btn-success"> <i
				class="fas fa-plus me-1"></i> Nuevo Laboratorio
			</a>
		</div>
		<div class="table-responsive">
			<table id="multi_col_order"
				class="table border table-striped table-bordered text-nowrap"
				style="width: 100%">
				<thead>
					<tr>
						<th>ID</th>
						<th>NOMBRE LABORATORIO</th>
						<th>TELÉFONO</th>
						<th>ACCIONES</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="indice : ${listaLaboratorio}">
						<td th:text="${indice.idLaboratorio}"></td>
						<td th:text="${indice.nombreLaboratorio}"></td>
						<td th:text="${indice.telefonoLaboratorio}"></td>
						<td>
							<a th:href="@{/laboratorio/editar/{idLaboratorio}(idLaboratorio=${indice.idLaboratorio})}"
							class="btn btn-primary" title="Editar"> <i class="far fa-edit"></i></a> 
							<a th:href="@{/laboratorio/eliminar/{idLaboratorio}(idLaboratorio=${indice.idLaboratorio})}" 
							class="btn btn-danger" title="Eliminar" 
							onclick="return confirm('¿Seguro que deseas eliminar este Laboratorio');">
							<i class="far fa-trash-alt"></i></a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
