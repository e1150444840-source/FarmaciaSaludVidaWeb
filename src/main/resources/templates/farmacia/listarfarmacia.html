<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Lista Farmacia</title>
</head>

<body>

	<!-- multi-column ordering -->
	<div layout:fragment="contenidopaguinas">
		<!-- Cabecera con Título y Botón Nuevo Cliente -->
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="card-title mb-0 fw-bold">LISTA DE FARMACIA</h4>
			<a th:href="@{/farmacia/nuevoFarmacia}" class="btn btn-success"> <i
				class="fas fa-plus me-1"></i> Nueva Farmacia
			</a>
		</div>
		<div class="table-responsive">
			<table id="multi_col_order"
				class="table border table-striped table-bordered text-nowrap"
				style="width: 100%">
				<thead>
					<tr>
						<th>ID</th>
						<th>NOMBRE FARMACIA</th>
						<th>CUIDAD</th>
						<th>DIRECCIÓN</th>
						<th>ACCIONES</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="indice : ${listaFarmacia}">
						<td th:text="${indice.idFarmacia}"></td>
						<td th:text="${indice.nombreFarmacia}"></td>
						<td th:text="${indice.ciudad}"></td>
						<td th:text="${indice.direccion}"></td>
						<td><a
							th:href="@{/farmacia/editar/{idFarmacia}(idFarmacia=${indice.idFarmacia})}"
							class="btn btn-primary" title="Editar"> <i
								class="far fa-edit"></i></a> <a href="" class="btn btn-danger"
							title="Eliminar"> <i class="far fa-trash-alt"></i></a></td>
					</tr>

				</tbody>
			</table>
		</div>
	</div>
</body>

</html>
