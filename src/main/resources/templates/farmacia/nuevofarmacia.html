<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantillaAdmin/plantillaui">

<head>
<meta charset="utf-8">
<title>Nueva Farmacia</title>
</head>

<body>
	<!-- Formulario Registro Nueva Farmacia -->
	<div layout:fragment="contenidopaguinas">
		<div class="row justify-content-center">
			<div class="col-lg-8">
				<!-- Tarjeta principal -->
				<div class="card shadow-sm border-0 rounded-3 my-3">

					<!-- Cabecera de la tarjeta -->
					<div class="card-header bg-primary text-white py-3 rounded-top">
						<h5 class="card-title mb-0 fw-bold">
							<i class="fas fa-clinic-medical me-2"></i> NUEVA FARMACIA
						</h5>
					</div>

					<!-- Cuerpo del formulario -->
					<div class="card-body p-4">
						<form th:action="@{/farmacia/guardar}" th:object="${farmacia}"
							method="post">
							<div class="mb-3">
								<input type="hidden" th:field="*{idFarmacia}" value="0" />
							</div>
							<div class="row g-3">
								<!-- Nombre de la Farmacia -->
								<div class="col-md-12">
									<label class="form-label fw-bold text-secondary">Nombre
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-store text-muted"></i></span> <input type="text"
											class="form-control" th:field="*{nombreFarmacia}"
											placeholder="Ej. Farmacia Salud y Vida - Sucursal Central"
											required>
									</div>
								</div>

								<!-- Dirección -->
								<div class="col-md-12">
									<label class="form-label fw-bold text-secondary">Dirección
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-map-marker-alt text-muted"></i></span> <input
											type="text" class="form-control" th:field="*{direccion}"
											placeholder="Ej. Av. 10 de Agosto y Bolívar" required>
									</div>
								</div>

								<!-- Ciudad -->
								<div class="col-md-12">
									<label class="form-label fw-bold text-secondary">Ciudad
										<span class="text-danger">*</span>
									</label>
									<div class="input-group">
										<span class="input-group-text bg-light"><i
											class="fas fa-city text-muted"></i></span> <input type="text"
											class="form-control" th:field="*{ciudad}"
											placeholder="Ej. Quito / Loja" required>
									</div>
								</div>
							</div>

							<!-- Botones de Acción -->
							<div
								class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
								<a th:href="@{/farmacia}" class="btn btn-outline-secondary px-4">
									<i class="fas fa-times me-1"></i> Cancelar
								</a>
								<button type="submit" class="btn btn-primary px-4">
									<i class="fas fa-save me-1"></i> Guardar
								</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
